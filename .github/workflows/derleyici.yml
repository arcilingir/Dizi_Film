# Bu araç @keyiflerolsun tarafından | @KekikAkademi için yazılmıştır.
name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.py"

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-22.04

    steps:
      - name: "'src' Depo Kontrolü"
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: "'build' Depo Kontrolü"
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Eski Derlemeleri Temizle
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3

      - name: Eklentileri Derle
        run: |
          set -e # Herhangi bir hatada adımı durdur
          cd $GITHUB_WORKSPACE/src
          
          chmod +x gradlew
          
          echo "=== GRADLE DERLEMESİ BAŞLIYOR ==="
          ./gradlew makePluginsJson --stacktrace
          ./gradlew make --stacktrace
          
          echo "=== TÜM DIZININ TARA SÜRÜCÜSÜ ==="
          find . -name "*.cs3"
          
          # .cs3 dosyalarını tara ve builds klasörüne taşı
          find . -type f -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/builds/ \;
          find . -type f -name "plugins.json" -exec cp {} $GITHUB_WORKSPACE/builds/ \;
          
          echo "=== BUILDS KLASÖRÜ İÇERİĞİ ==="
          ls -la $GITHUB_WORKSPACE/builds
