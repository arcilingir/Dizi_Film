# Bu araç @keyiflerolsun tarafından | @KekikAkademi için yazılmıştır.
name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.py"

# Uyarıları tamamen kapatan global değişkenler:
env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-22.04

    steps:
      - name: "'src' Depo Kontrolü"
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: "'build' Depo Kontrolü"
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Eski Derlemeleri Temizle
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3

      - name: Eklentileri Derle
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          
          # .cs3 dosyalarını tara ve builds klasörüne taşı
          find . -type f -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/builds/ \;
          
          # plugins.json dosyasını bul ve kopyala
          find . -type f -name "plugins.json" -exec cp {} $GITHUB_WORKSPACE/builds/ \;
          
          # İşlem sonrası kontrol logu
          echo "=== BUILDS KLASÖRÜNE TAŞINAN DOSYALAR ==="
          ls -la $GITHUB_WORKSPACE/builds

